# Local development services. Not used in production.
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meacreo
      POSTGRES_PASSWORD: meacreo
      POSTGRES_DB: meacreo
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meacreo"]
      interval: 5s
      retries: 10

  # Catches all outgoing email. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # S3-compatible object storage. Console at http://localhost:9001 (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  postgres-data:
  minio-data:
