name: Daily cycle

# Calls the app's protected daily endpoint (billing reminders, health, reports) once a day.
# Needs repository secrets SITE_URL (e.g. https://www.meacreo.co.za) and CRON_SECRET
# (the same value as CRON_SECRET on Render). Skips quietly until both exist.
on:
  schedule:
    - cron: "0 4 * * *" # 06:00 in South Africa
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/daily
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/daily"
